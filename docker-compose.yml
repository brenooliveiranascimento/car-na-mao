# Local development: database + API + site. The mobile app runs on the host (Expo).
# Start everything with `npm run dev` from the repository root.
name: car-na-mao-dev

services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: carnamao
      POSTGRES_PASSWORD: carnamao
      POSTGRES_DB: carnamao
    ports:
      - "5432:5432"
    volumes:
      - pgdata-dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U carnamao -d carnamao"]
      interval: 5s
      retries: 10

  api:
    build:
      context: ./apps/api
      target: dev
    environment:
      DATABASE_URL: postgres://carnamao:carnamao@db:5432/carnamao
      PORT: 3000
      AI_PROVIDER: ${AI_PROVIDER:-mock}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
    ports:
      - "3000:3000"
    volumes:
      - ./apps/api/src:/app/src
      - ./apps/api/migrations:/app/migrations
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: ./apps/web
      target: dev
    environment:
      NEXT_PUBLIC_REPOSITORY_URL: ${NEXT_PUBLIC_REPOSITORY_URL:-https://github.com/}
      NEXT_PUBLIC_CONTACT_EMAIL: ${NEXT_PUBLIC_CONTACT_EMAIL:-}
      WATCHPACK_POLLING: "true"
    ports:
      - "3001:3000"
    volumes:
      - ./apps/web/src:/app/src
      - ./apps/web/public:/app/public

volumes:
  pgdata-dev:
